apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: iron-bank
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: iron-bank
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/version: main-98aa5f39efc389621b3a8f83782f479c58cf5c62

configMapGenerator:
  - name: iron-bank-config
    envs:
      - config/application.properties

generatorOptions:
  disableNameSuffixHash: false
  labels:
    type: generated
  annotations:
    note: generated

images:
 - name: iron-bank-server
   newName: ghcr.io/bnsouzas/iron-bank-v2
   newTag: jvm-main-98aa5f39efc389621b3a8f83782f479c58cf5c62

resources:
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
